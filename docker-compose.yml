services:
  ai-office:
    build:
      context: ./services/lami-office-react
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-office}-ai-office
    restart: unless-stopped
    ports:
      - "${AI_OFFICE_PORT:-8088}:8090"
      - "${LAMI_OFFICE_PORT:-8090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HERMES_HOME:-~/.hermes}:/root/.hermes:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - PUBLIC_MODE=${PUBLIC_MODE:-live}
      - INGEST_TOKEN=${INGEST_TOKEN:-}
      - A2A_SECRET=${A2A_SECRET:-}
      - A2A_POLL_INTERVAL=${A2A_POLL_INTERVAL:-10}
      - A2A_PEERS=${A2A_PEERS:-}
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}

