name: CI

# Three jobs, cheapest first: a syntax error or a stale asset should not cost
# 80 seconds of e2e time to discover. See docs/CI.md for why there is no matrix.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: web/js parses
        run: |
          for f in web/js/*.js; do
            node -c "$f" || exit 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: python parses
        run: python3 -m compileall -q server.py world.py scripts deploy tests

  guard:
    name: Guard (world sync + assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: world.py matches config.js
        run: python3 scripts/assets/check_world_sync.py
      - name: committed assets are current
        run: |
          python3 scripts/assets/generate_tileset.py --check
          python3 scripts/assets/generate_tilemap.py --check
          python3 scripts/assets/stamp_assets.py --check

  test:
    name: E2E (378 tests)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run suite
        run: node tests/run_all_e2e.js
